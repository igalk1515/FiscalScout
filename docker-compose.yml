services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-0}
    environment:
      DATABASE_URL: postgres://scraper:scraper@db:5432/scraper
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RENDER_JS: ${RENDER_JS:-false}
      PORT: "3000"
      RAW_DIR: /data/raw
    ports:
      - "3000:3000"
    volumes:
      - rawpages:/data/raw
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rawpages:
